spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  h2:
    console:
      enabled: true

app:
  jwt:
    secret: test-secret-key-for-testing-purposes-only-min-256-bits-required
    expiration-ms: 3600000
    refresh-expiration-ms: 7200000
  security:
    max-login-attempts: 5
    lockout-duration-ms: 900000
    rate-limit-requests: 100
    rate-limit-window-ms: 60000

mercadopago:
  access-token: test-token
  public-key: test-public-key
  notification-url: http://localhost:8081/api/mercadopago/webhook
  webhook-secret: test-webhook-secret
  retry:
    max-attempts: 3
    delay-ms: 1000

backup:
  enabled: false
  directory: /tmp/osmech-backup-test

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.osmech: DEBUG
    org.springframework.security: DEBUG
