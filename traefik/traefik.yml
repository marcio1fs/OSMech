global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entrypoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        options: default

certificatesResolvers:
  letsencrypt:
    acme:
      email: contato@osmech.com.br
      storage: acme.json
      httpChallenge:
        entryPoint: web
      # Staging (teste - comentar quando funcionar)
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory

api:
  dashboard: true
  debug: false

providers:
  docker:
    endpoint: unix:///var/run/docker.sock
    exposedByDefault: false
    network: traefik-proxy
    watch: true
  file:
    filename: /traefik.yml
    watch: true

log:
  level: INFO
  format: common

accessLog:
  format: common
