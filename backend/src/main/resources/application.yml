server:
  port: 8081

spring:
  application:
    name: osmech-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficina_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:20}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000
      leak-detection-threshold: 30000

  # Timeouts para requisições HTTP externas
  http:
    connect-timeout: 5000
    read-timeout: 30000
    write-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  jackson:
    serialization:
      write-dates-as-timestamps: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}
    baseline-version: ${FLYWAY_BASELINE_VERSION:1}

# Configuração JWT — Em produção, defina JWT_SECRET via variável de ambiente!
# IMPORTANTE: A variável JWT_SECRET é obrigatória. Sem ela, o app não inicia.
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION:86400000}  # 24 horas
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 dias
  security:
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-duration-ms: ${LOCKOUT_DURATION:900000}  # 15 minutos
    rate-limit-requests: ${RATE_LIMIT_REQUESTS:100}
    rate-limit-window-ms: ${RATE_LIMIT_WINDOW:60000}  # 1 minuto

# Actuator (health checks e métricas)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    db:
      enabled: false  # Usamos nosso próprio DatabaseHealthIndicator
    diskspace:
      enabled: false  # Usamos nosso próprio StorageHealthIndicator
    ping:
      enabled: true

# Configurações de Health Check
db:
  health:
    query-timeout-ms: ${DB_HEALTH_QUERY_TIMEOUT:1000}

storage:
  min-free-space-mb: ${STORAGE_MIN_FREE_SPACE_MB:100}

external:
  services:
    timeout-ms: ${EXTERNAL_SERVICES_TIMEOUT:5000}

# CORS
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:8083,http://localhost:3000}

# Configuração futura WhatsApp (Twilio / Meta)
whatsapp:
  enabled: false
  provider: twilio  # twilio | meta
  twilio:
    account-sid: ""
    auth-token: ""
    from-number: ""
  meta:
    phone-number-id: ""
    access-token: ""

# Configuração futura IA (OpenAI)
ai:
  enabled: ${AI_ENABLED:false}
  provider: ${AI_PROVIDER:openai}
  openai:
    api-key: ${AI_OPENAI_API_KEY:}
    model: ${AI_OPENAI_MODEL:gpt-4o-mini}
    base-url: ${AI_OPENAI_BASE_URL:https://api.openai.com/v1/chat/completions}

# Configuração Mercado Pago (Checkout Pro)
mercadopago:
  access-token: ${MERCADOPAGO_ACCESS_TOKEN}
  public-key: ${MERCADOPAGO_PUBLIC_KEY}
  back-urls:
    success: ${MERCADOPAGO_SUCCESS_URL:}
    pending: ${MERCADOPAGO_PENDING_URL:}
    failure: ${MERCADOPAGO_FAILURE_URL:}
  notification-url: ${MERCADOPAGO_NOTIFICATION_URL:}
  webhook-secret: ${MERCADOPAGO_WEBHOOK_SECRET:}
  retry:
    max-attempts: ${MERCADOPAGO_RETRY_MAX_ATTEMPTS:3}
    delay-ms: ${MERCADOPAGO_RETRY_DELAY:2000}

# Configurações de Backup
backup:
  enabled: ${BACKUP_ENABLED:true}
  directory: ${BACKUP_DIR:/var/backups/osmech}
  retention-days: ${BACKUP_RETENTION_DAYS:30}
  encryption-enabled: ${BACKUP_ENCRYPTION:false}
  s3:
    enabled: ${S3_BACKUP_ENABLED:false}
    bucket: ${S3_BUCKET:}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
  gcs:
    enabled: ${GCS_BACKUP_ENABLED:false}
    bucket: ${GCS_BUCKET:}
    credentials-path: ${GCS_CREDENTIALS_PATH:}
  notifications:
    enabled: ${BACKUP_NOTIFICATIONS:false}
    webhook: ${BACKUP_NOTIFICATION_WEBHOOK:}

# Configurações de Upload de Arquivos
upload:
  max-file-size: ${UPLOAD_MAX_FILE_SIZE:10485760}  # 10MB
  max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:20971520}  # 20MB
  allowed-image-types: ${UPLOAD_ALLOWED_IMAGE_TYPES:image/jpeg,image/png,image/gif,image/webp}
  allowed-document-types: ${UPLOAD_ALLOWED_DOCUMENT_TYPES:application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain}
  storage-path: ${UPLOAD_STORAGE_PATH:/var/osmech/uploads}
  cleanup-enabled: ${UPLOAD_CLEANUP_ENABLED:true}

logging:
  level:
    com.osmech.payment.service: DEBUG
    org.springframework.retry: INFO
